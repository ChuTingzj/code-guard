services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: codeguard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codeguard}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d codeguard"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-codeguard}@postgres:5432/codeguard
      REDIS_URL: redis://redis:6379
      APP_ROLE: all
      PORT: "3001"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3001:3001"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_BASE_URL: http://server:3001/api/v1
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3001/api/v1
    depends_on:
      - server
    ports:
      - "3000:3000"

volumes:
  pgdata:
  redisdata:
